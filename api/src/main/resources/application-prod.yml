app:
  jwt:
    secret: ${APP_JWT_SECRET}
  ldap:
    url: ${APP_LDAP_URL}
    user-dn-pattern: ${APP_LDAP_USER_DN_PATTERN}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

spring:
  h2:
    console:
      enabled: false
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
